---
# Inventaire du laboratoire de supervision.
#
# Les adresses ci-dessous sont des exemples. Remplacer par celles du parc
# réel avant toute exécution.
#
# Les noms d'inventaire gagnent à reprendre les noms réels des machines,
# pour qu'une sortie de playbook soit lisible sans table de correspondance.
#
# Topologie :
#   - le central Centreon tourne sur srv-central-01, la machine Rocky qui
#     dispose de 4 Go de mémoire, seule à en avoir assez pour porter MariaDB,
#     PHP-FPM, Apache, le broker et le moteur
#   - le contrôleur Ansible reste une machine Ubuntu, et il est supervisé
#   - tous les hôtes supervisés remontent leurs métriques en SNMP v3
#
# Aucun mot de passe ne figure ici : voir group_vars/all/vault.yml.

all:
  children:

    # -----------------------------------------------------------------
    # Serveur central Centreon : collecteur, interface web et base
    # 4 Go de mémoire, 2 vCPU
    # -----------------------------------------------------------------
    centreon_central:
      hosts:
        srv-central-01:
          ansible_host: 10.0.0.25

    # -----------------------------------------------------------------
    # Contrôleur Ansible, décrit ici pour être supervisé lui aussi
    # -----------------------------------------------------------------
    ansible_controller:
      hosts:
        ctrl-ansible:
          ansible_host: 10.0.0.10

    # -----------------------------------------------------------------
    # Hôtes supervisés, regroupés par famille de distribution
    # -----------------------------------------------------------------
    monitored:
      children:
        monitored_debian_family:
          hosts:
            ctrl-ansible:
              ansible_host: 10.0.0.10
              centreon_host_alias: Contrôleur Ansible
              centreon_host_groups: [Linux-Servers, Infra-Automation]
            srv-ubuntu-01:
              ansible_host: 10.0.0.31
              centreon_host_alias: Serveur Ubuntu 01
              centreon_host_groups: [Linux-Servers]
            srv-ubuntu-02:
              ansible_host: 10.0.0.32
              centreon_host_alias: Serveur Ubuntu 02
              centreon_host_groups: [Linux-Servers]

        monitored_rhel_family:
          hosts:
            # Reste en Rocky 10.1 : simple hôte supervisé, il ne reçoit que
            # net-snmp et aucun paquet Centreon. La matrice de compatibilité
            # Centreon ne s'applique qu'au central et aux collecteurs.
            srv-rocky-01:
              ansible_host: 10.0.0.41
              centreon_host_alias: Serveur Rocky 01
              centreon_host_groups: [Linux-Servers]
            srv-central-01:
              ansible_host: 10.0.0.25
              centreon_host_alias: Serveur central Centreon
              centreon_host_groups: [Linux-Servers, Supervision]
