---
# Pont entre les noms du coffre et les variables consommées par les rôles.
# Ce découpage permet de relire d'un coup d'œil quel rôle utilise quel secret,
# sans jamais avoir à déchiffrer le coffre.

centreon_web_admin_password: "{{ vault_centreon_web_admin_password }}"
centreon_db_root_password: "{{ vault_centreon_db_root_password }}"
centreon_db_password: "{{ vault_centreon_db_password }}"

snmp_agent_v3_auth_passphrase: "{{ vault_snmp_agent_v3_auth_passphrase }}"
snmp_agent_v3_priv_passphrase: "{{ vault_snmp_agent_v3_priv_passphrase }}"
snmp_agent_v2c_community: "{{ vault_snmp_agent_v2c_community | default('') }}"
