---
# Variables propres au serveur central en production.

# SELinux passe en enforcing une fois la plateforme en marche. Le rôle
# installe les politiques publiées par Centreon, pose les booléens
# nécessaires, redémarre, observe une minute, puis relève les accès refusés.
# S'il y en a, ou si l'interface cesse de répondre, il revient de lui-même en
# permissive et le dit : une supervision aveugle est un incident plus grave
# qu'une politique non appliquée.
centreon_selinux_state: enforcing
centreon_manage_firewall: true
centreon_run_web_installer: true
centreon_send_statistics: false

# Exposition de l'interface web. En HTTPS, avec redirection du trafic en
# clair : sans cela, les identifiants et le jeton de session circulent en
# clair sur le réseau.
#
# Aucun certificat n'étant fourni, le rôle en produit un auto-signé : il
# chiffre le transport mais n'authentifie pas le serveur, et les navigateurs
# le signaleront. Pour aller au bout, renseigner centreon_web_tls_certificate
# et centreon_web_tls_key depuis le coffre, avec un certificat signé par une
# autorité reconnue du parc, puis passer centreon_web_validate_certs à true.
centreon_web_protocol: https
centreon_web_port: 443
centreon_web_admin_login: admin

# Point d'entrée de l'API de configuration, utilisé hors des rôles.
centreon_api_url: >-
  {{ centreon_web_protocol }}://{{ ansible_host }}:{{ centreon_web_port }}/centreon/api/index.php
centreon_api_user: "{{ centreon_web_admin_login }}"
centreon_api_password: "{{ centreon_web_admin_password }}"
