---
# Inventaire de production.
#
# Les adresses ci-dessous sont des exemples, à remplacer par celles du parc
# réel.
#
# Ce qui distingue cet inventaire de celui du laboratoire ne tient pas aux
# machines mais aux variables, dans group_vars/all/main.yml : le fuseau
# horaire, la synchronisation de l'heure et /etc/hosts n'y sont pas touchés,
# et le déploiement se fait par vagues au lieu d'un seul tenant.
#
# Avant toute exécution, lire group_vars/all/main.yml.

all:
  children:

    # -----------------------------------------------------------------
    # Serveur central Centreon
    # -----------------------------------------------------------------
    centreon_central:
      hosts:
        srv-central-01:
          ansible_host: 10.0.0.25

    # -----------------------------------------------------------------
    # Contrôleur Ansible, supervisé lui aussi
    # -----------------------------------------------------------------
    ansible_controller:
      hosts:
        ctrl-ansible:
          ansible_host: 10.0.0.10

    # -----------------------------------------------------------------
    # Hôtes supervisés, regroupés par famille de distribution
    # -----------------------------------------------------------------
    monitored:
      children:
        monitored_debian_family:
          hosts:
            ctrl-ansible:
              ansible_host: 10.0.0.10
              centreon_host_alias: Contrôleur Ansible
              centreon_host_groups: [Linux-Servers, Infra-Automation]
            srv-ubuntu-01:
              ansible_host: 10.0.0.31
              centreon_host_alias: Serveur Ubuntu 01
              centreon_host_groups: [Linux-Servers]
            srv-ubuntu-02:
              ansible_host: 10.0.0.32
              centreon_host_alias: Serveur Ubuntu 02
              centreon_host_groups: [Linux-Servers]

        monitored_rhel_family:
          hosts:
            srv-rocky-01:
              ansible_host: 10.0.0.41
              centreon_host_alias: Serveur Rocky 01
              centreon_host_groups: [Linux-Servers]
            srv-central-01:
              ansible_host: 10.0.0.25
              centreon_host_alias: Serveur central Centreon
              centreon_host_groups: [Linux-Servers, Supervision]
