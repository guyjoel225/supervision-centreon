[defaults]
inventory            = inventories/lab/hosts.yml
roles_path           = roles
collections_path     = collections
host_key_checking    = True
interpreter_python   = auto_silent
stdout_callback      = default
result_format        = yaml
callbacks_enabled    = profile_tasks, timer
retry_files_enabled  = False
forks                = 10
timeout              = 30
display_skipped_hosts = False
# Décommenter après avoir créé le fichier (voir docs/exploitation.md).
# Sinon, exporter ANSIBLE_VAULT_PASSWORD_FILE ou passer --ask-vault-pass.
# vault_password_file = .vault_pass

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey
