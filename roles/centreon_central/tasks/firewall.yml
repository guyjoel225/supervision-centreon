---
# Détection rapide, alignée sur celle du rôle snmp_agent : interroger l'état
# du service coûte moins d'une seconde, là où service_facts énumérait toutes
# les unités systemd de la machine.
- name: Relever l'état de firewalld
  ansible.builtin.systemd_service:
    name: firewalld
  register: _centreon_central_firewalld
  changed_when: false
  failed_when: false

- name: Ouvrir les flux de la supervision
  when: (_centreon_central_firewalld.status | default({})).get('ActiveState', '') == 'active'
  ansible.posix.firewalld:
    port: "{{ item.port }}/{{ item.proto }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ centreon_central_firewall_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }} ({{ item.comment }})"
