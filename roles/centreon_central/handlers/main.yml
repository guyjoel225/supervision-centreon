---
# Les handlers de redémarrage ne sont pas joués en simulation : --check ne
# redémarre rien, et le service peut ne pas exister encore parce que son
# paquet n'a pas été réellement posé. Les faire échouer là n'apprendrait
# rien et empêcherait la simulation d'aller au bout.
- name: Redemarrer php-fpm
  ansible.builtin.service:
    name: php-fpm
    state: restarted
  when: not ansible_check_mode

- name: Redemarrer httpd
  ansible.builtin.service:
    name: httpd
    state: restarted
  when: not ansible_check_mode

- name: Redemarrer mariadb
  ansible.builtin.service:
    name: mariadb
    state: restarted
  when: not ansible_check_mode

- name: Recharger firewalld
  ansible.builtin.service:
    name: firewalld
    state: reloaded
  when: not ansible_check_mode

- name: Recharger les unites systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode

- name: Vider le cache des depots
  ansible.builtin.command:
    cmd: dnf clean all --enablerepo=*
  changed_when: true
