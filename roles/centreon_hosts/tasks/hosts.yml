---
- name: Lister les hôtes existants
  ansible.builtin.uri:
    url: "{{ centreon_hosts_api_url }}?action=action&object=centreon_clapi"
    validate_certs: "{{ centreon_hosts_validate_certs }}"
    method: POST
    headers: "{{ _centreon_hosts_headers }}"
    body_format: json
    body:
      action: show
      object: HOST
    return_content: true
    timeout: "{{ centreon_hosts_api_timeout }}"
  register: _centreon_hosts_host_existing
  changed_when: false

- name: Retenir les hôtes déjà déclarés
  ansible.builtin.set_fact:
    _centreon_hosts_known_hosts: >-
      {{ _centreon_hosts_host_existing.json.result | default([]) | map(attribute='name', default='') | select | list }}

# Format attendu par CLAPI :
#   nom;alias;adresse;modèles;collecteur;groupes
- name: Créer les hôtes manquants
  ansible.builtin.uri:
    url: "{{ centreon_hosts_api_url }}?action=action&object=centreon_clapi"
    validate_certs: "{{ centreon_hosts_validate_certs }}"
    method: POST
    headers: "{{ _centreon_hosts_headers }}"
    body_format: json
    body:
      action: add
      object: HOST
      values: >-
        {{ item }};{{ hostvars[item].centreon_host_alias | default(item) }};{{
        hostvars[item].ansible_host | default(item) }};{{
        hostvars[item].centreon_host_template | default(centreon_hosts_default_host_template) }};{{
        centreon_hosts_poller_name }};{{
        hostvars[item].centreon_host_groups | default([]) | join('|') }}
    return_content: true
    timeout: "{{ centreon_hosts_api_timeout }}"
  loop: "{{ _centreon_hosts_target_hosts }}"
  when: item not in _centreon_hosts_known_hosts
  register: _centreon_hosts_host_created
  changed_when: true

- name: Retenir les hôtes créés lors de ce passage
  ansible.builtin.set_fact:
    _centreon_hosts_new_hosts: >-
      {{ _centreon_hosts_target_hosts | difference(_centreon_hosts_known_hosts) }}

- name: Poser la communauté SNMP quand les agents répondent en v2c
  when: centreon_hosts_snmp_version == '2c'
  ansible.builtin.uri:
    url: "{{ centreon_hosts_api_url }}?action=action&object=centreon_clapi"
    validate_certs: "{{ centreon_hosts_validate_certs }}"
    method: POST
    headers: "{{ _centreon_hosts_headers }}"
    body_format: json
    body:
      action: setparam
      object: HOST
      values: "{{ item }};snmp_community;{{ centreon_hosts_snmp_community }}"
    return_content: true
    timeout: "{{ centreon_hosts_api_timeout }}"
  loop: "{{ _centreon_hosts_target_hosts }}"
  no_log: true
  changed_when: item in _centreon_hosts_new_hosts

- name: Fixer la version SNMP de chaque hôte
  ansible.builtin.uri:
    url: "{{ centreon_hosts_api_url }}?action=action&object=centreon_clapi"
    validate_certs: "{{ centreon_hosts_validate_certs }}"
    method: POST
    headers: "{{ _centreon_hosts_headers }}"
    body_format: json
    body:
      action: setparam
      object: HOST
      values: "{{ item }};snmp_version;{{ centreon_hosts_snmp_version }}"
    return_content: true
    timeout: "{{ centreon_hosts_api_timeout }}"
  loop: "{{ _centreon_hosts_target_hosts }}"
  changed_when: item in _centreon_hosts_new_hosts
